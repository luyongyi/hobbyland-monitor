name: Deploy to Server

on:
  push:
    branches: [main]
  # 支持手动触发，可临时改端口
  workflow_dispatch:
    inputs:
      app_port:
        description: '容器映射到宿主机的端口'
        required: false
        default: '8000'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_PORT: ${{ github.event.inputs.app_port || '8000' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: APP_PORT
          script: |
            set -e

            # ---- 配置 ----
            DEPLOY_DIR="/opt/hobbyland-monitor"
            REPO_URL="https://github.com/luyongyi/hobbyland-monitor.git"
            BRANCH="main"

            echo "=== Deploying hobbyland-monitor ==="
            echo "App port: $APP_PORT"

            # 首次部署：克隆仓库
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "First deploy: cloning repo..."
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
              mkdir -p data
            else
              echo "Updating repo..."
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            # 确保 data 目录存在
            mkdir -p data

            # 写入端口配置到 .env（docker-compose.yml 会读取）
            echo "APP_PORT=$APP_PORT" > .env

            # 重建并重启容器
            echo "Building and restarting container on port $APP_PORT..."
            docker compose up -d --build --remove-orphans

            # 清理旧镜像
            docker image prune -f

            echo "=== Deploy complete ==="
            echo "Container listening on host port $APP_PORT"
            docker compose ps
