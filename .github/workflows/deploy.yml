name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_port:
        description: '容器映射到宿主机的端口'
        required: false
        default: '8000'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_PORT: ${{ github.event.inputs.app_port || '8000' }}
          DOMAIN: ${{ secrets.DOMAIN }}
          SSL_CERT_NAME: ${{ secrets.SSL_CERT_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: APP_PORT,DOMAIN,SSL_CERT_NAME
          script: |
            set -e

            DEPLOY_DIR="/opt/hobbyland-monitor"
            REPO_URL="https://github.com/luyongyi/hobbyland-monitor.git"
            BRANCH="main"

            echo "=== Deploying hobbyland-monitor ==="
            echo "App port: $APP_PORT"

            # 拉取最新代码
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "First deploy: cloning repo..."
              sudo git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
              sudo chown -R $USER:$USER "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$DEPLOY_DIR"
            sudo mkdir -p data

            # 同步 nginx 配置（如果设置了 DOMAIN secret）
            if [ -n "$DOMAIN" ] && [ -f "infra/nginx/site.conf.template" ]; then
              echo "Configuring nginx for domain: [redacted]"
              SITE_CONF="/etc/nginx/sites-available/hobbyland-monitor"
              sed -e "s|__DOMAIN__|${DOMAIN}|g" \
                  -e "s|__SSL_CERT_NAME__|${SSL_CERT_NAME:-$DOMAIN}|g" \
                  infra/nginx/site.conf.template | sudo tee "$SITE_CONF" > /dev/null
              sudo ln -sf "$SITE_CONF" /etc/nginx/sites-enabled/hobbyland-monitor
              sudo nginx -t && sudo nginx -s reload && echo "nginx config synced"
            else
              echo "DOMAIN secret not set; skipping nginx config sync"
            fi

            # 写入端口到 .env
            echo "APP_PORT=$APP_PORT" > .env

            # 重建容器
            echo "Building and restarting container on port $APP_PORT..."
            sudo docker compose up -d --build --remove-orphans
            sudo docker image prune -f

            echo "=== Deploy complete ==="
            sudo docker compose ps
